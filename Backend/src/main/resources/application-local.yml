spring:
  datasource:
    url: jdbc:mysql://localhost:3306/voxcode_db?allowPublicKeyRetrieval=true&useSSL=false
    username: voxcode_user
    password: voxcode_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-migration-naming: true

logging:
  level:
    root: INFO
    com.example.VoxCode: DEBUG

voxcode:
  workspace:
    base-dir: ${VOXCODE_WORKSPACE_DIR:/tmp/voxcode/workspaces}
