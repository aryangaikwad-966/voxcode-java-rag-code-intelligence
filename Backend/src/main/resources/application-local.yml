spring:
  datasource:
    url: jdbc:mysql://localhost:3306/voxcode_db?allowPublicKeyRetrieval=true&useSSL=false
    username: voxcode_user
    password: voxcode_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.example.VoxCode: DEBUG
